[workspace]
name = "shortwave"
authors = ["Felix Häcker haeckerfelix@gnome.org"]
channels = ["conda-forge"]
platforms = [
    { platform = "linux-64", glibc = "2.34" },
    { platform = "linux-aarch64", glibc = "2.34" },
    "osx-arm64",
    "win-64",
]
preview = ["pixi-build"]

[activation.env]
RUST_LOG = "shortwave=debug,cast_sender=debug"
RUST_BACKTRACE = "1"

[target.unix.activation.env]
GETTEXT_DIR = "$CONDA_PREFIX"
MESON_PREFIX = "$CONDA_PREFIX"
XDG_DATA_DIRS = "$CONDA_PREFIX/share:$XDG_DATA_DIRS"

[target.win.activation.env]
GETTEXT_DIR = "%CONDA_PREFIX%"
MESON_PREFIX = "%CONDA_PREFIX%\\Library"
XDG_DATA_DIRS = "%CONDA_PREFIX%\\Library\\share;%XDG_DATA_DIRS%"

[tasks]
setup = { cmd = "meson setup build --prefix=$MESON_PREFIX -Dprofile=development --reconfigure", outputs = [
    "build/build.ninja",
] }
build = { cmd = "ninja -C build", depends-on = ["setup"] }
install = { cmd = "ninja -C build install", depends-on = ["build"] }
app = { cmd = "shortwave-devel", depends-on = ["install"] }

[dependencies]
font-ttf-adwaita = "*"
glycin-gtk4 = "*"
gst-plugins-bad = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"
gst-plugins-ugly = "*"
gstreamer = "*"
libadwaita = "*"
libsqlite = "*"

c-compiler = "*"
cargo-deny = "*"
meson = "*"
pkgconfig = "*"
rust = "*"
rust-src = "*"

expat = "*"
zlib = "*"
freetype = "*"
libxml2-devel = "*"

[target.unix.dependencies]
libshumate = "*"

[target.linux.dependencies]
glycin-loaders = "*"

[workspace.build-variants]
profile = ["default", "development"]

[package]
build.backend = { name = "pixi-build-rattler-build", version = "*" }
build.config = { recipe = "build-aux/conda/recipe.yaml", experimental = true }
