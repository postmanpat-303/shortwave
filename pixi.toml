[workspace]
name = "Shortwave"
authors = ["Felix Häcker haeckerfelix@gnome.org"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[activation.env]
RUST_LOG = "shortwave=debug,cast_sender=debug"
RUST_BACKTRACE = "1"
GSETTINGS_BACKEND = "keyfile"

[target.unix.activation.env]
GETTEXT_DIR = "$CONDA_PREFIX"
MESON_PREFIX = "$CONDA_PREFIX"
XDG_DATA_HOME = "$PIXI_PROJECT_ROOT/xdg-home/data"
XDG_CACHE_HOME = "$PIXI_PROJECT_ROOT/xdg-home/cache"
XDG_CONFIG_HOME = "$PIXI_PROJECT_ROOT/xdg-home/config"
XDG_DATA_DIRS = "$CONDA_PREFIX/share:$XDG_DATA_DIRS"

[target.win.activation.env]
GETTEXT_DIR = "%CONDA_PREFIX%"
MESON_PREFIX = "%CONDA_PREFIX%\\Library"
XDG_DATA_HOME = "%PIXI_PROJECT_ROOT%\\xdg-home\\data"
XDG_CACHE_HOME = "%PIXI_PROJECT_ROOT%\\xdg-home\\cache"
XDG_CONFIG_HOME = "%PIXI_PROJECT_ROOT%\\xdg-home\\config"
XDG_DATA_DIRS = "%CONDA_PREFIX%\\Library\\share;%XDG_DATA_DIRS%"

[target.osx.activation.env]
RUSTFLAGS = "-C link-arg=-Wl,-rpath,$CONDA_PREFIX/lib"

[system-requirements]
libc = { family = "glibc", version = "2.34" }

[tasks]
setup = { cmd = "meson setup build --prefix=$MESON_PREFIX -Dprofile=development --reconfigure", outputs = [
    "build/build.ninja",
] }
build = { cmd = "ninja -C build", depends-on = ["setup"] }
install = { cmd = "ninja -C build install", depends-on = ["build"] }
app = { cmd = "shortwave", depends-on = ["install"] }

[dependencies]
glycin-gtk4 = "*"
gst-plugins-bad = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"
gst-plugins-ugly = "*"
gstreamer = "*"
libadwaita = "*"
libsqlite = "*"

c-compiler = "*"
cargo-deny = "*"
gettext = "*"
meson = "*"
pkgconfig = "*"
rust = "*"
rust-src = "*"

expat = "*"
zlib = "*"
freetype = "*"
libxml2-devel = "*"

[target.unix.dependencies]
libshumate = "*"

[target.linux.dependencies]
sysroot_linux-64 = ">=2.34"
glycin-loaders = "*"
