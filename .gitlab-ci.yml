include:
  - project: "GNOME/citemplates"
    file: "flatpak/flatpak_ci_initiative.yml"

variables:
  BUNDLE: "de.haeckerfelix.Shortwave.Devel.flatpak"
  MANIFEST_PATH: "build-aux/de.haeckerfelix.Shortwave.Devel.json"
  FLATPAK_MODULE: "shortwave"
  APP_ID: "de.haeckerfelix.Shortwave.Devel"
  RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"
  RUNTIME_IMAGE: "quay.io/gnome_infrastructure/gnome-runtime-images:gnome-master"

# Flatpak Builds

flatpak-build@linux-x86_64:
  extends: ".flatpak@x86_64"

flatpak-build@linux-aarch64:
  extends: ".flatpak@aarch64"

flatpak-publish@linux-x86_64:
  extends: ".publish_nightly"
  needs: ["flatpak-build@linux-x86_64"]

flatpak-publish@linux-aarch64:
  extends: ".publish_nightly"
  needs: ["flatpak-build@linux-aarch64"]

# Pixi Builds

.pixi-build: &pixi-build
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        PROFILE: "default"
    - variables:
        PROFILE: "development"
  script:
    - pixi publish --path . --variant profile=$PROFILE
  artifacts:
    paths:
      - "*.conda"

pixi-build@linux-x86_64:
  <<: *pixi-build
  image: ghcr.io/prefix-dev/pixi:latest
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git

pixi-build@linux-aarch64:
  <<: *pixi-build
  image: ghcr.io/prefix-dev/pixi:latest
  tags:
    - flatpak-aarch64
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git

pixi-build@windows-x86_64:
  <<: *pixi-build
  tags:
    - win32-ps
  variables:
    PIXI_HOME: "${CI_PROJECT_DIR}/.pixi-home"
    PIXI_NO_PATH_UPDATE: "1"
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "core.longpaths"
    GIT_CONFIG_VALUE_0: "true"
  before_script:
    - iwr -useb https://pixi.sh/install.ps1 | iex
    - $env:Path = "$env:PIXI_HOME\bin;$env:Path"

pixi-build@macos-arm64:
  <<: *pixi-build
  tags:
    - macos
    - arm64
  variables:
    ORKA_RUNNER: sonoma-5
    PIXI_HOME: "${CI_PROJECT_DIR}/.pixi-home"
    PIXI_NO_PATH_UPDATE: "1"
  before_script:
    - curl -fsSL https://pixi.sh/install.sh | sh
    - export PATH="${PIXI_HOME}/bin:$PATH"

pixi-publish:
  image: ghcr.io/prefix-dev/pixi:latest
  needs:
    - pixi-build@linux-x86_64
    - pixi-build@linux-aarch64
    - pixi-build@windows-x86_64
    - pixi-build@macos-arm64
#  rules:
#    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - pixi upload prefix --channel haecker-felix/shortwave *.conda

# Checks

.flatpak-command: &flatpak-command
  image: '${RUNTIME_IMAGE}'
  tags:
    - flatpak
  script:
    - flatpak-builder --user --disable-rofiles-fuse --keep-build-dirs --stop-at=${FLATPAK_MODULE} flatpak_app ${MANIFEST_PATH}
    - flatpak build-finish --share=network flatpak_app
    - echo "cd .. && ${COMMAND}" | flatpak-builder --user --disable-rofiles-fuse --build-shell=${FLATPAK_MODULE} flatpak_app ${MANIFEST_PATH}

cargo-fmt:
  <<: *flatpak-command
  variables:
    COMMAND: "./build-aux/checks.sh cargo_fmt"

cargo-typos:
  <<: *flatpak-command
  variables:
    COMMAND: "cargo install typos-cli && ./build-aux/checks.sh cargo_typos"

cargo-deny:
  <<: *flatpak-command
  variables:
    COMMAND: "cargo install cargo-deny && ./build-aux/checks.sh cargo_deny"

cargo-clippy:
  <<: *flatpak-command
  variables:
    COMMAND: "./build-aux/checks.sh cargo_clippy"

potfiles:
  image: alpine
  script:
    - apk add --no-cache git
    - ./build-aux/checks.sh potfiles
