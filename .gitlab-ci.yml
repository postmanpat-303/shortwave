include:
  - project: "GNOME/citemplates"
    file: "flatpak/flatpak_ci_initiative.yml"

variables:
  BUNDLE: "de.haeckerfelix.Shortwave.Devel.flatpak"
  MANIFEST_PATH: "build-aux/de.haeckerfelix.Shortwave.Devel.json"
  FLATPAK_MODULE: "shortwave"
  APP_ID: "de.haeckerfelix.Shortwave.Devel"
  RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"

# Flatpak Builds

flatpak-build@linux-x86_64:
  extends: ".flatpak@x86_64"
  stage: build

flatpak-build@linux-aarch64:
  extends: ".flatpak@aarch64"
  stage: build

flatpak-publish@linux-x86_64:
  extends: ".publish_nightly"
  needs: ["flatpak-build@linux-x86_64"]

flatpak-publish@linux-aarch64:
  extends: ".publish_nightly"
  needs: ["flatpak-build@linux-aarch64"]

# Pixi Builds

.pixi-build: &pixi-build
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        PROFILE: "default"
    - variables:
        PROFILE: "development"
  script:
    - pixi publish --path . --variant profile=$PROFILE
  artifacts:
    paths:
      - "*.conda"

pixi-build@linux-x86_64:
  <<: *pixi-build
  image: ghcr.io/prefix-dev/pixi:latest
  before_script:
    - pixi global install git

pixi-build@linux-aarch64:
  <<: *pixi-build
  image: ghcr.io/prefix-dev/pixi:latest
  tags:
    - flatpak-aarch64
  before_script:
    - pixi global install git

pixi-build@windows-x86_64:
  <<: *pixi-build
  tags:
    - win32-ps
  variables:
    PIXI_HOME: "${CI_PROJECT_DIR}/.pixi-home"
    PIXI_NO_PATH_UPDATE: "1"
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "core.longpaths"
    GIT_CONFIG_VALUE_0: "true"
  before_script:
    - iwr -useb https://pixi.sh/install.ps1 | iex
    - $env:Path = "$env:PIXI_HOME\bin;$env:Path"

pixi-build@macos-arm64:
  <<: *pixi-build
  tags:
    - macos
    - arm64
  variables:
    ORKA_RUNNER: tahoe-3
    PIXI_HOME: "${CI_PROJECT_DIR}/.pixi-home"
    PIXI_NO_PATH_UPDATE: "1"
  before_script:
    - curl -fsSL https://pixi.sh/install.sh | sh
    - export PATH="${PIXI_HOME}/bin:$PATH"

.pixi-publish: &pixi-publish
  stage: deploy
  image: ghcr.io/prefix-dev/pixi:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - pixi upload prefix --channel haecker-felix/shortwave *.conda

pixi-publish@linux-x86_64:
  <<: *pixi-publish
  needs: ["pixi-build@linux-x86_64"]

pixi-publish@linux-aarch64:
  <<: *pixi-publish
  needs: ["pixi-build@linux-aarch64"]

pixi-publish@windows-x86_64:
  <<: *pixi-publish
  needs: ["pixi-build@windows-x86_64"]

pixi-publish@macos-arm64:
  <<: *pixi-publish
  needs: ["pixi-build@macos-arm64"]

# Checks

.pixi-check: &pixi-check
  stage: test
  image: ghcr.io/prefix-dev/pixi:latest

cargo-fmt:
  <<: *pixi-check
  script:
    - pixi run --locked check cargo_fmt

cargo-typos:
  <<: *pixi-check
  script:
    - pixi run --locked check cargo_typos

cargo-deny:
  <<: *pixi-check
  script:
    - pixi run --locked check cargo_deny

cargo-clippy:
  <<: *pixi-check
  script:
    - pixi run --locked check cargo_clippy

potfiles:
  <<: *pixi-check
  script:
    - pixi run --locked check potfiles
